<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Umbra</title>
  <!--
    The Umbra mark: an occulting body crossing a light source.
    Held just past second contact — the crescent is the most legible phase at
    favicon size, where a totality ring collapses into a smudge.
  -->
  <mask id="occlusion">
    <rect width="100" height="100" fill="#000"/>
    <circle cx="50" cy="50" r="34" fill="#fff"/>
    <circle cx="67" cy="43" r="34" fill="#000"/>
  </mask>
  <circle cx="50" cy="50" r="34" fill="#f2eee8" mask="url(#occlusion)"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#e8442a" stroke-width="1.5" opacity="0.5"/>
</svg>
