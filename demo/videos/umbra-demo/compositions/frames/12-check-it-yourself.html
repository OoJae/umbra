      var CH = 10.5; /* IBM Plex Mono advance = 0.6em at 17.5px — exact */

      var CPS = 84; /* chars/sec — 462 verbatim chars have to land inside 7.44s */
      var NL = 0.05; /* newline beat */
      var CMD = 0.2; /* the pause between the two shell invocations */
      var END = 7.44;

      /* stepped ease: a pure function of progress, so it is seek-exact.
         value = ceil(p*n)/n  ->  the mask lands on whole-character multiples. */
      function steps(n) {
        return function (p) {
          return p <= 0 ? 0 : p >= 1 ? 1 : Math.ceil(p * n) / n;
        };
      }

      /* type ONE line: the mask steps open and the caret steps with it */
      function typeLine(panel, slot, chars, at) {
        var w = chars * CH;
        var d = chars / CPS;
        var e = steps(chars);
        tl.fromTo(
          panel + " .f12-l" + slot,
          { width: 0 },
          { width: w, duration: d, ease: e, immediateRender: false },
          at
        );
        tl.set(panel + " .f12-caret", { y: slot * LH, x: 0, opacity: 1 }, at);
        tl.fromTo(
          panel + " .f12-caret",
          { x: 0 },
          { x: w, duration: d, ease: e, immediateRender: false },
          at
        );
        return at + d;
      }

      /* draw / cut are always the FIRST tween on that element's property, so
         immediateRender stamps the hidden base state at build — no CSS

          sel,
          { opacity: 0 },
          {

            duration: dur,
            ease: "none",
            stagger: stagger || 0
          },
          at
