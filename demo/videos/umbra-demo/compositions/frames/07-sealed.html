        { scale: 1, x: 0, y: 0 },
        { scale: 1.06, x: -18, y: -10, duration: DUR, ease: "none" },

      /* ── 0.18 / 1.02 / 1.86 — the three steps tick as the VO names them ───── */
      draw(".f07-hl.f07-y240", 0.18, 0.45);

      draw(".f07-hr.f07-y240", 2.2, 0.5);
      cut(".f07-kicker-r", 2.26, 0.2);
      rise(".f07-q1 .f07-mi", 2.52, 0.5, 0.88);

      draw(".f07-rule-c", 1.3, 0.6);
      cut(".f07-code-label", 2.7, 0.22);
      tl.fromTo(
        ".f07-line",

      /* ── THE DRIVER ───────────────────────────────────────────────────────
         One tween carries timeline time from CODE_IN to the end of the frame
         and hands it to render() through a `modifiers` hook rather than an
         update callback: the renderer seeks frame-by-frame and seek()
         suppresses callbacks, but modifiers run on every render, either way.
         Because it spans the whole hold as well, every frame after the snap

      var drv = { t: CODE_IN };
      tl.fromTo(

        { t: CODE_IN },
        {
          t: DUR,
          duration: DUR - CODE_IN,
          ease: "none",
          immediateRender: false,
          modifiers: {
            t: function (v) {
              var time = Number(v);
              render(time);
              return time;
            }
          }
        },

      tl.fromTo(

      cut(".f07-mk2", 5.84, 0.3, 0.62);

      cut(".f07-mk3", 8.06, 0.3, 0.62);

      window.__timelines["07-sealed"] = tl;
