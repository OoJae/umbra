      <div data-hf-id="hf-pv1s" id="p1-medallion">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var glow = document.getElementById("p1-glow");
      var word = document.getElementById("p1-word");

      var GLOW_PEAK = 0.28;
      var OPACITY_AMP = 0.035;
      var SCALE_AMP = 0.02;
      var BLOOM_START = 0.1;
      var BLOOM_DUR = 1.6;
      var BREATHE_DUR = 8.74;
      var BREATHE_CYCLES = 2.5;

      /* ── Scene 1 (0.0–2.1) — the crescent resolves out of black.
            ambient-glow-bloom Form A: the halo blooms behind the hero and
            lands on the hero's settle, so both read as ONE beat. ────────── */
      tl.fromTo(
        "#p1-glow",
        { opacity: 0, scale: 0.86, transformOrigin: "590px 550px" },
        {
          opacity: GLOW_PEAK,
          scale: 1,
          duration: BLOOM_DUR,
          ease: "power2.out",
          transformOrigin: "590px 550px",
        },
        BLOOM_START
      );

      tl.fromTo(
        "#p1-medallion",
        { opacity: 0 },
        { opacity: 1, duration: BLOOM_DUR, ease: "expo.out" },
        BLOOM_START
      );

      /* bounded idle breathe on the halo — finite phase tween, no yoyo loop.
         Driven through a `modifiers` hook rather than onUpdate: the renderer
         seeks frame-by-frame and seek() suppresses callbacks, but modifiers
         run on every render, forward or backward. */
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * BREATHE_CYCLES,
          duration: BREATHE_DUR,
          ease: "none",
          modifiers: {
            p: function (v) {
              var p = Number(v);
              var s = Math.sin(p);
              glow.style.opacity = String(GLOW_PEAK + s * OPACITY_AMP);
              glow.style.transform = "scale(" + (1 + s * SCALE_AMP) + ")";
              return p;
            },
          },
        },
        BLOOM_START + BLOOM_DUR
      );

      /* ── Scene 2 (2.1–5.6) — VO 01. Nothing but the crescent, breathing.
            Slow continuous 1.00→1.04 scale drift, no easing snap. ───────── */
      tl.fromTo(
        "#p1-medallion",
        { scale: 1, transformOrigin: "963.3px 335.4px" },
        {
          scale: 1.04,
          duration: 3.5,
          ease: "none",
          transformOrigin: "963.3px 335.4px",
        },
        2.1
      );

      /* The drift carries on under the hold so the shot never freezes.
         immediateRender:false — otherwise this fromTo stamps scale 1.04 onto
         the medallion at build time and the crescent pops back to 1.00 when
         the 2.1s tween finally starts. */
      tl.fromTo(
        "#p1-medallion",
        { scale: 1.04, transformOrigin: "963.3px 335.4px" },
        {
          scale: 1.062,
          duration: 4.84,
          ease: "none",
          transformOrigin: "963.3px 335.4px",
          immediateRender: false,
        },
        5.6
      );

      /* ── Scene 3 (5.6–8.4) — UMBRA sets, lower-left, against the ash rule.
            discrete-text-sequence: whole text states swapped at thresholds,
            reverse-searched each frame; 60ms stagger. ────────────────────── */
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.02, text: "U" },
        { t: 0.08, text: "UM" },
        { t: 0.14, text: "UMB" },
        { t: 0.2, text: "UMBR" },
        { t: 0.26, text: "UMBRA" },
      ];

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      tl.fromTo(
        "#p1-mark",
        { opacity: 0, scale: 0.45 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        5.6
      );

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 0.6,
          duration: 0.6,
          ease: "none",
          modifiers: {
            t: function (v) {
              var time = Number(v);
              word.textContent = textAt(time);
              return time;
            },
          },
        },
        5.6
      );

      /* The tracking settle (0.34em -> 0.22em) was cut deliberately.
       *
       * letterSpacing is a layout property: it snaps to integer device pixels on
       * every reflow, so under a seek-by-frame capture engine the ease-out tail
       * stutters instead of gliding — lint flags it as gsap_non_transform_motion.
       * The per-letter reveal above already carries "the letters settle", so the
       * tracking simply holds at its final 0.22em in CSS. Animating it properly
       * would mean splitting to per-glyph x transforms for a effect nobody would
       * consciously notice. */

      tl.fromTo(
        "#p1-rule",
        { scaleX: 0, transformOrigin: "left center" },
        {
          scaleX: 1,
          duration: 0.85,
          ease: "power3.out",
          transformOrigin: "left center",
        },
        5.78
      );

      /* ── Scene 4 (8.4–10.44) — "…trust whoever is holding it."
            The crescent dims 15% and holds. Not an exit: it settles. ─────── */
      tl.fromTo(
        "#p1-stage",
        { opacity: 1 },
        { opacity: 0.85, duration: 0.9, ease: "power2.inOut" },
        8.4
      );

      window.__timelines["01-the-promise"] = tl;
    })();
  </script>
