      var BLOOM_DUR = 0.86; /* BLOOM_START + BLOOM_DUR lands on the disc settle */
      var GLOW_START_SCALE = 0.9;
      var CORONA_REST = 0.97;
      var OPACITY_AMP = 0.03;
      var PLATE_SCALE_AMP = 0.016;
      var BREATHE_START = 1.04;
      var BREATHE_DUR = 6.75;
      var BREATHE_CYCLES = 2; /* ~3.4s per breath */

      /* masked line rise — the inner rises inside an overflow-hidden mask */

        tl.fromTo(
          sel,
          { yPercent: 108, opacity: 0 },
          {
            yPercent: 0,
            opacity: 1,
            duration: dur,
            ease: "power3.out",
            stagger: stagger || 0

          at
        );

      function fade(sel, at, dur, to) {
        tl.fromTo(
          sel,
          { opacity: 0 },
          { opacity: to === undefined ? 1 : to, duration: dur, ease: "power2.out" },
          at

      /* ══ Scene 1 (0.0–1.4) — TOTALITY ═════════════════════════════════════
         The occluder slides fully over the source. The screen falls to
         near-black; the corona is what is left. One move, and it is the
         whole point of the frame. ─────────────────────────────────────────── */

      /* the disc travels to concentric — 1.0s expo.out */

        "#u05-occluder",
        { x: -336 },
        { x: 0, duration: 1.0, ease: "expo.out" },
        0.04
      );

      /* the ambient light goes with the coverage, locked to the same curve */
      tl.fromTo(
        "#u05-flare",
        { opacity: 1 },
        { opacity: 0, duration: 1.0, ease: "expo.out" },
        0.04
      );

      /* ambient-glow-bloom Form A — the corona swells in behind the disc and
         lands on its settle, so shadow and light read as ONE beat. */
      tl.fromTo(
        "#u05-glowfield",
        { opacity: 0, scale: GLOW_START_SCALE, transformOrigin: "1400px 392px" },
        {
          opacity: 1,
          scale: 1,
          duration: BLOOM_DUR,
          ease: "power2.out",
          transformOrigin: "1400px 392px"

        BLOOM_START

      /* ── bounded idle breathe on the corona during the hold. A finite phase
            tween driven through `modifiers`, never onUpdate: the renderer
            seeks frame-by-frame and seek() suppresses callbacks, while
            modifiers run on every render. sin(0) = 0, so the breathe begins
            exactly at the bloom's resting state. ──────────────────────────── */

      tl.to(
        phase,
        {
          p: Math.PI * 2 * BREATHE_CYCLES,
          duration: BREATHE_DUR,
          ease: "none",
          modifiers: {
            p: function (v) {
              var p = Number(v);
              var s1 = Math.sin(p);
              var s2 = Math.sin(p * 0.74); /* slower period — never in lockstep */
              corona.style.opacity = String(CORONA_REST + s1 * OPACITY_AMP);
              plate.style.transform = "scale(" + (1 + s2 * PLATE_SCALE_AMP) + ")";
              return p;

        },
        BREATHE_START

      /* ══ Scene 2 (1.4–5.0) — the definition, legible beneath ══════════════
         Left-anchored. Three lines, one at a time, slow. The plate holds and
         the corona breathes underneath. Nothing else happens. ─────────────── */

      rise("#u05-head .u05-m:nth-child(1) .u05-mi", 1.86, 0.74);
      rise("#u05-head .u05-m:nth-child(2) .u05-mi", 2.52, 0.74);
