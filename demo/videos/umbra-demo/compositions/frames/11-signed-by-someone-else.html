      /* ══ 8.60 — "Secure boot on." ══ */
      typeSeq(
        q("#f11-val3"),
        q("#f11-cur3"),
        [
          { t: 0.0, text: "" },
          { t: 0.08, text: "t" },
          { t: 0.16, text: "tr" },
          { t: 0.24, text: "tru" },
          { t: 0.32, text: "true" }
        ],
        8.6,
        0.42,
        0.32
      );

      /* ══ 9.95 — "Debug disabled since boot." ══ */
      typeSeq(
        q("#f11-val4"),
        q("#f11-cur4"),
        [
          { t: 0.0, text: "" },
          { t: 0.07, text: "dis" },
          { t: 0.15, text: "disab" },
          { t: 0.24, text: "disabled" },
          { t: 0.33, text: "disabled-" },
          { t: 0.44, text: "disabled-sin" },
          { t: 0.55, text: "disabled-since" },
          { t: 0.66, text: "disabled-since-b" },
          { t: 0.8, text: "disabled-since-boot" }
        ],
        9.95,
        0.9,
        0.8
      );

      /* ── 10.50 — the quiet footnote that hands off to the anchor ── */
      rise(q("#f11-note"), 10.5, 0.75, 10);

      /* ══════════════════════════════════════════════════════════════════
       * VO 16 (11.4–18.4) — the browser hashes the token and compares it to
       * Flare. The document recedes; the two hashes take the axis.
       * ══════════════════════════════════════════════════════════════════ */
      draw(q("#f11-rule-anchor"), 11.7, 0.95);
      tl.fromTo(
        q("#f11-att"),
        { opacity: 1 },
        { opacity: 0.3, duration: 1.0, ease: "power2.inOut", immediateRender: false },
        11.85
      );
      rise(q("#f11-anchor-lbl"), 12.05, 0.55);

      /* ── 12.30 — "Your browser hashes that token…" — row A computes itself,
       * left to right, arriving off the left wing. ── */
      rise(q("#f11-lblA"), 12.3, 0.5, 10);
      tl.fromTo(
        q("#f11-hashA"),
        { x: -16 },
        { x: 0, duration: 0.95, ease: "expo.out", immediateRender: false },
        12.6
      );
      tl.fromTo(
        charsA,
        { opacity: 0, y: 12 },
        {
          opacity: 1,
          y: 0,
          duration: 0.5,
          ease: "power2.out",
          stagger: 0.011,
          immediateRender: false
        },
        12.6
      );

      /* ── 13.75 — "…compares it to what is anchored on Flare." Row B arrives
       * off the OPPOSITE wing and slides up onto row A's axis: the columns
       * visibly lock. ── */
      rise(q("#f11-lblB"), 13.75, 0.5, 10);
      tl.fromTo(
        q("#f11-hashB"),
        { opacity: 0, y: 54, x: 16 },
        {
          opacity: 1,
          y: 0,
          x: 0,
          duration: 1.05,
          ease: "expo.out",
          immediateRender: false
        },
        14.45
      );

      /* ══ 15.50 — the eye does the verifying. A scan head walks the two rows
       * left to right; every character pair it clears locks from dim to bone.
       * No claim is made until the last character. ══ */
      tl.fromTo(
        q("#f11-scan"),
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.out", immediateRender: false },
        SWEEP_AT
      );
      tl.fromTo(
        q("#f11-scan"),
        { x: -2 },
        { x: 1582, duration: SWEEP_DUR, ease: "none", immediateRender: false },
        SWEEP_AT
      );

      var lastIdx = -1;
      function applySweep(p) {
        var idx = Math.floor(p * N);
        if (idx > N) idx = N;
        if (idx < 0) idx = 0;
        if (idx === lastIdx) return;
        lastIdx = idx;
        for (var i = 0; i < N; i++) {
          var c = i < idx ? BONE : DIM;
          charsA[i].style.color = c;
          charsB[i].style.color = c;
        }
      }
      var sweep = { p: 0 };
      tl.to(
        sweep,
        {
          p: 1,
          duration: SWEEP_DUR,
          ease: "none",
          modifiers: {
            p: function (v) {
              applySweep(parseFloat(v));
              return v;
            }
          }
        },
        SWEEP_AT
      );

      /* 17.50 — the head reaches the last character and parks. It settles
       * back to a faint terminus so the frame is completely still for the
       * 0.35s before the pin. (A settle, not an exit — it stays lit.) */
      tl.fromTo(
        q("#f11-scan"),
        { opacity: 1 },
        {
          opacity: 0.22,
          duration: 0.3,
          ease: "power2.out",
          immediateRender: false
        },
        SWEEP_AT + SWEEP_DUR
      );

      /* ══════════════════════════════════════════════════════════════════
       * 17.85 — "…whether it MATCHED." The sweep has been finished for
       * 0.35s and nothing has moved. Then the chip resolves. Locked.
       * ══════════════════════════════════════════════════════════════════ */
      tl.fromTo(
        q("#f11-match"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false },
        MATCH_AT
      );

      /* hold the timeline to the full frame length */
      tl.to(q("#f11-ground"), { opacity: 1, duration: 0.01 }, D - 0.01);

      window.__timelines[FRAME] = tl;
    })();
  </script>
