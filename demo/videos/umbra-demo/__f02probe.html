    /* The real capture, cut to the band it needs. The top ramp takes the site

    /* ── One occluder: the page's kicker, held in shadow for a beat. Its

    .f02-occ-kicker-clip {

    }
    .f02-occ-kicker {

    /* ── Headline recede — two nested soft ramps make a feathered rectangle,
          so the dim has no edge anywhere and never reaches the eclipse. ────── */
    .f02-recede {
      position: absolute;
      left: 170px;
      top: 210px;
      width: 760px;
      height: 400px;
      opacity: 0;
      -webkit-mask-image: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 1) 70px,
        rgba(0, 0, 0, 1) 690px,
        rgba(0, 0, 0, 0) 760px
      );
      mask-image: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 1) 70px,
        rgba(0, 0, 0, 1) 690px,
        rgba(0, 0, 0, 0) 760px
      );
      -webkit-mask-repeat: no-repeat;

    .f02-recede-v {
      position: absolute;

      -webkit-mask-image: linear-gradient(

    /* ── The third line, set live so it can count. Bodoni Moda at the page's

    .f02-fig {

  <script>
    (function () {
      /* GSAP is loaded synchronously by the host document (index.html head) */
      var g = window.gsap;
      window.__timelines = window.__timelines || {};
      var tl = g.timeline({ paused: true });

      var DUR = 11.86;

      /* ── The pin ────────────────────────────────────────────────────────────
         VO 03 lands the word "million" at 10.63s frame-relative (abs 20.89s in
         the recorded read; this frame starts at abs 10.26s). The count is built
         BACKWARD from that instant: COUNT_END is the pin, COUNT_DUR is taken
         from the count-up rule's legible band (1.2–2.5s), and COUNT_START is
         whatever is left — 8.53s, which falls under "…their own venue". So the
         digits are still climbing across "About three hundred" and the numeral
         reaches 300 on the syllable, not before it. */
      var PIN = 10.63;
      var COUNT_DUR = 2.1;
      var COUNT_START = PIN - COUNT_DUR; /* 8.53 */
      var FIG_IN = 6.9; /* the empty slot arrives — Scene 3 opens */
      var TARGET = 300;

      var slots = [
        document.getElementById("f02-d0"),
        document.getElementById("f02-d1"),
        document.getElementById("f02-d2")
      ];
      var tallyNum = document.getElementById("f02-tally-num");

      /* opacity cut — the eclipse-wipe at the root is the entrance; inside the
         frame the plate simply IS there */
      function cut(sel, at, dur, to) {
        tl.fromTo(
          sel,
          { opacity: 0 },
          { opacity: to === undefined ? 1 : to, duration: dur, ease: "none" },
          at
        );
      }

      /* ── Scene 1 (0.0–1.6) — the occluding disc hands the frame over and the
            /record hero is standing there. Under everything, the plate drifts:
            a 0.8% push whose origin sits on the eclipse, so the type eases
            outward and nothing at 1:1 ever exposes an edge. ───────────────── */
      cut(".f02-ground", 0, 0.08);
      cut(".f02-stage", 0, 0.12);

      tl.fromTo(
        ".f02-stage",
        { scale: 1, transformOrigin: "1220px 460px" },
        { scale: 1.008, duration: DUR, ease: "none", transformOrigin: "1220px 460px" },
        0
      );

      /* 0.85 — "…twenty eleven…": the shadow slides off the page's own kicker,
         inside its own clip, so nothing beyond that line is touched. */
      tl.fromTo(
        ".f02-occ-kicker",
        { x: 0 },
        { x: 406, duration: 0.5, ease: "power2.out" },
        0.85
      );

      /* ── Scene 2 (1.6–6.9) — "Eight venues." holds, the dollar figure stays
            masked, and the record is tallied underneath: one mark per venue
            across "…essentially every major US dark pool operator." ──────── */
      tl.fromTo(
        ".f02-tally-rule",
        { scaleX: 0, transformOrigin: "left center" },
        {
          scaleX: 1,
          duration: 0.62,
          ease: "power2.out",
          transformOrigin: "left center"
        },
        2.95
      );
      cut(".f02-tally-num", 3.58, 0.3);

      var TICK_AT = [3.6, 4.02, 4.44, 4.86, 5.28, 5.7, 6.12, 6.54];
      for (var i = 0; i < TICK_AT.length; i++) {
        tl.fromTo(
          ".f02-tick:nth-of-type(" + (i + 1) + ")",
          { scaleY: 0, opacity: 0, transformOrigin: "center bottom" },
          {
            scaleY: 1,
            opacity: 1,
            duration: 0.24,
            ease: "power3.out",
            transformOrigin: "center bottom"
          },
          TICK_AT[i]
        );
      }

      /* the tally numeral steps 01→08 with the marks. Driven through a
         `modifiers` hook, not onUpdate: the renderer seeks frame by frame and
         seek() suppresses callbacks, while modifiers run on every render —
         forward, backward, and on the tween's own start/end states. */
      var tally = { t: 0 };
      tl.to(
        tally,
        {
          t: 7.2,
          duration: 7.2,
          ease: "none",
          modifiers: {
            t: function (v) {
              var t = Number(v);
              var n = 0;
              for (var k = 0; k < TICK_AT.length; k++) {
                if (t >= TICK_AT[k]) n = k + 1;
              }
              tallyNum.textContent = n === 0 ? "" : "0" + n;
              return t;
            }
          }
        },
        0
      );

      /* ── Scene 3 (6.9–10.63) — the figure. The currency mark lands first, on
            "misrepresenting", an empty slot waiting for a number; the digits
            arrive with the count itself. ──────────────────────────────────── */
      tl.fromTo(
        ".f02-dollar",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        FIG_IN
      );

      /* counting-dynamic-scale, value half: one linear driver spans the whole
         figure window and maps timeline time → digits, so the slots read EMPTY
         before COUNT_START and 300 at and after the pin, on any seek in either
         direction. Ease is quad-out — shared with the scale below — chosen
         over the rule's default quartic so the last units are still ticking
         into 10.63 rather than having crept to 300 a second early. */
      function renderValue(v) {
        if (v === null) {
          slots[0].textContent = "";
          slots[1].textContent = "";
          slots[2].textContent = "";
          return;
        }
        var s = String(v);
        for (var k = 0; k < 3; k++) {
          slots[k].textContent = k < s.length ? s.charAt(k) : "";
        }
      }

      var count = { t: FIG_IN };
      tl.to(
        count,
        {
          t: PIN,
          duration: PIN - FIG_IN,
          ease: "none",
          modifiers: {
            t: function (v) {
              var t = Number(v);
              if (t < COUNT_START) {
                renderValue(null);
                return t;
              }
              var p = (t - COUNT_START) / COUNT_DUR;
              if (p < 0) p = 0;
              if (p > 1) p = 1;
              var e = 1 - (1 - p) * (1 - p); /* power1.out */
              renderValue(Math.round(TARGET * e));
              return t;
            }
          }
        },
        FIG_IN
      );

      /* counting-dynamic-scale, growth half: the final type size is static CSS
         — only the transform moves, on the same window and the same ease as
         the value, about the figure's own baseline so it grows in place. */
      tl.fromTo(
        ".f02-fig",
        { scale: 0.96, transformOrigin: "0px 149px" },
        {
          scale: 1,
          duration: COUNT_DUR,
          ease: "power1.out",
          transformOrigin: "0px 149px"
        },
        COUNT_START
      );

      /* 8.40 — the headline gives way: "Eight venues." recedes and the tally
         settles back, so the numeral owns the frame while it climbs. */
      tl.fromTo(
        ".f02-recede",
        { opacity: 0 },
        { opacity: 0.34, duration: 0.9, ease: "power2.inOut" },
        8.4
      );
      tl.fromTo(
        ".f02-tally",
        { opacity: 1 },
        { opacity: 0.42, duration: 0.9, ease: "power2.inOut" },
        8.4
      );

      /* ── 10.63 — THE PIN. The count has just reached 300 and on the same
            frame the unit rises into place: the line completes exactly as the
            narrator completes it. ────────────────────────────────────────── */
      tl.fromTo(
        ".f02-mil",
        { yPercent: 100 },
        { yPercent: 0, duration: 0.5, ease: "power3.out" },
        PIN
      );

      /* ── Scene 4 (10.63–11.86) — hold. Red on the numeral alone. ────────── */
      tl.to(".f02-ground", { opacity: 1, duration: 0.01 }, DUR - 0.01);

      window.__timelines["02-eight-venues"] = tl;
    })();
  </script>
