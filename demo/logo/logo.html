<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* 480x480 project avatar. The mark alone, not the wordmark — at the size
         DoraHacks actually renders this (a small tile in a gallery), four letters
         of "UMBRA" become unreadable mush, whereas an eclipse crescent stays
         legible down to a favicon. */
      * { margin: 0; padding: 0; }
      html, body { width: 480px; height: 480px; background: #06070b; overflow: hidden; }
      .stage { width: 480px; height: 480px; display: grid; place-items: center; position: relative; }
      /* corona bloom behind the disc, so the mark sits in light rather than on a flat field */
      /* The mark must sit ABOVE the bloom. .bloom is positioned and the svg was not,
         and CSS paints positioned elements above non-positioned siblings regardless
         of DOM order — so the bloom was washing the shadow from void to mid-grey. */
      svg { position: relative; z-index: 1; }
      .bloom {
        position: absolute;
        z-index: 0;
        width: 400px; height: 400px; border-radius: 50%;
        background:
          radial-gradient(circle,
            rgba(242,238,232,0.14) 33%,
            rgba(232,68,42,0.10) 40%,
            rgba(6,7,11,0) 60%);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bloom"></div>
      <svg width="300" height="300" viewBox="0 0 100 100" fill="none">
        <mask id="occ">
          <rect width="100" height="100" fill="#000" />
          <circle cx="50" cy="50" r="34" fill="#fff" />
          <!-- occluding body, held just past second contact: the most legible phase -->
          <circle cx="67" cy="43" r="34" fill="#000" />
        </mask>
        <!-- The source disc, painted opaque void FIRST. Two reasons: without it the
             mask leaves the occluded area transparent and the bloom behind shows
             through, so the shadow renders mid-grey and reads as a lit sphere rather
             than a silhouette — an umbra is the absence of light and must be the
             darkest thing in the mark. And painting the SOURCE disc rather than the
             occluder keeps the shadow inside the ring: a true occluder is larger than
             the source and spills past the rim, which is astronomically correct but
             reads as a lopsided bite at avatar size. -->
        <circle cx="50" cy="50" r="34" fill="#06070b" />
        <!-- the chromosphere ring: the hydrogen-alpha rim visible only at totality -->
        <circle cx="50" cy="50" r="34" fill="none" stroke="#e8442a" stroke-width="1.4" opacity="0.5" />
        <!-- the light that survives the occlusion -->
        <circle cx="50" cy="50" r="34" fill="#f2eee8" mask="url(#occ)" />
      </svg>
    </div>
  </body>
</html>
