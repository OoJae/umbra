[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
# Bumped from the guide's ^0.8.20: @flarenetwork/flare-periphery-contracts@0.1.52
# declares `pragma solidity ^0.8.25` in FtsoV2Interface.sol, so 0.8.20 cannot compile it.
solc_version = "0.8.25"
# Flare chains have historically rejected PUSH0 (Shanghai) bytecode. Targeting london keeps
# deploys safe; revisit only if a dependency needs a cancun-only opcode.
evm_version = "london"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"

[etherscan]
coston2 = { key = "${EXPLORER_API_KEY}", url = "https://coston2-explorer.flare.network/api", chain = 114 }
